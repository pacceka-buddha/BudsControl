[package]
name = "budscontrol"
version.workspace = true
description = "Tray app for OnePlus / OPPO / realme earbuds (HeyMelody protocol)"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "budscontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
buds-core = { path = "../crates/buds-core", features = ["fake"] }
buds-bt = { path = "../crates/buds-bt" }
buds-art = { path = "../crates/buds-art" }
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
ts-rs = "12.0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
