name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No section for $version in CHANGELOG.md" >&2
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}"
          sed -i -E "s#\]\(((docs/|README\.md)[^)]*)\)#](${base}/blob/${GITHUB_REF_NAME}/\1)#g" notes.md
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: Buds Control ${{ github.ref_name }}
          body_path: notes.md

  windows:
    needs: notes
    name: Windows installer + portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*-setup.exe
            release/*-portable.zip

  linux:
    needs: notes
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev pkg-config patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: ./scripts/package-linux.sh
      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.AppImage
            release/*.deb

  macos:
    needs: notes
    name: macOS dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: ./scripts/package-macos.sh
      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.dmg
