[package]
name = "buds-bt"
version.workspace = true
description = "Per-OS Bluetooth RFCOMM backends for buds-core"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
buds-core = { version = "0.1.0", path = "../buds-core" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Devices_Bluetooth", "Win32_System_Time", "Win32_System_IO"] }
