[package]
name = "buds-core"
version.workspace = true
description = "Platform-independent HeyMelody protocol, device catalog and controller"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
interprocess = { version = "2.4.8", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
ts-rs = "12.0.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time", "sync"] }
buds-core = { path = ".", features = ["fake"] }

[features]
# Simulated Buds 4 platform (`buds_core::fake`) for UI work, the CLI `--fake` flag and tests.
fake = []
